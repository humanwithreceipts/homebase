<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human With Receipts — Under Construction</title>
    <meta name="description" content="Human With Receipts — site under construction. Independent work on AI, open-source technology, and verifiable transparency.">
    <meta property="og:title" content="Human With Receipts">
    <meta property="og:description" content="Under construction. Independent work on AI, open-source technology, and verifiable transparency.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://humanwithreceipts.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #222;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #c9a84c;
            --accent-dim: #a07d2e;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at top left, rgba(201, 168, 76, 0.10), transparent 32rem),
                radial-gradient(circle at bottom right, rgba(160, 125, 46, 0.08), transparent 28rem),
                var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .eyebrow {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            margin-bottom: 1.25rem;
        }

        .badge {
            display: inline-block;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid var(--accent-dim);
            border-radius: 999px;
            padding: 0.35rem 0.9rem;
            margin-bottom: 2rem;
        }

        p.lead {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 44ch;
            margin: 0 auto 1.5rem;
        }

        p.note {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--border);
            margin: 2rem auto;
        }

        .email {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-dim);
            padding-bottom: 2px;
        }
        .email:hover { color: #e0c066; }
    </style>
</head>
<body>
    <div class="container">
        <p class="eyebrow">Human With Receipts</p>
        <h1>Under construction</h1>
        <div class="badge">Site coming soon</div>
        <p class="lead">
            We're rebuilding this space. Independent work on AI, open-source
            technology, and verifiable transparency — receipts to follow.
        </p>
        <div class="divider"></div>
        <p class="note">
            Questions or project inquiries:
            <br>
            <a class="email" href="mailto:humanwithreceipts@gmail.com">humanwithreceipts@gmail.com</a>
        </p>
    </div>
</body>
</html>
